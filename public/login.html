<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ffffff; --ink: #0a0a0a; --ink-3: #9b9b9b; --line: #e6e6e6; --danger: #d0021b;
      --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Space Grotesk", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --paper: #0b0b0b; --ink: #f2f2f2; --ink-3: #6b6b6b; --line: #1f1f1f; color-scheme: dark }
    }
    :root[data-theme="dark"] { --paper: #0b0b0b; --ink: #f2f2f2; --ink-3: #6b6b6b; --line: #1f1f1f; color-scheme: dark }
    * { box-sizing: border-box }
    body { font-family: var(--sans); background:var(--paper); color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0 }
    .card { background:var(--paper); padding:32px; border:1px solid var(--ink); width:100%; max-width:340px }
    h1 { font:400 26px var(--sans); letter-spacing:-0.03em; text-transform:lowercase; margin:0 0 20px }
    h1::before { content:"■ " }
    label { display:block; font:11px var(--mono); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; color:var(--ink-3) }
    input { width:100%; padding:10px; border:1px solid var(--line); border-radius:0; font-family:var(--sans); font-size:14px; background:var(--paper); color:var(--ink); outline:none }
    input:focus { border-color:var(--ink) }
    button { width:100%; margin-top:16px; padding:10px; border:1px solid var(--ink); border-radius:0; background:var(--ink); color:var(--paper); font:11px var(--mono); text-transform:uppercase; letter-spacing:0.03em; cursor:pointer }
    button:hover { background:var(--paper); color:var(--ink) }
    .error { color:var(--danger); font:11px var(--mono); margin-top:12px }
    .hidden { display:none }
  </style>
  <script>
    try {
      var t = localStorage.getItem('uiTheme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>Studio inventory</h1>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autofocus required>
    <button type="submit">Sign in</button>
    <div class="error hidden" id="loginError">Incorrect password.</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('loginError').classList.remove('hidden');
    }
  </script>
</body>
</html>
